name: Deploy website to Vercel

# 触发条件：main 分支有变化就部署。
# path 过滤：只有网站相关文件（website/ 或本工作流本身）改动时才跑，
# 避免改 Tauri 源码也触发一次无意义的网站部署。
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# 同一时间只保留最新一次部署，新的推送会取消正在进行的旧任务
concurrency:
  group: vercel-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 所有 Vercel CLI 命令都在 website/ 目录里执行，
    # 这样 Vercel 把这个静态站当成独立项目，不受根目录 Tauri 配置影响。
    defaults:
      run:
        working-directory: website
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build static site
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
