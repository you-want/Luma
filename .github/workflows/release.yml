name: Release (build & publish)

# 推送 v* tag 后，在 macOS 与 Windows runner 分别构建，最后汇总到一个 GitHub Release。
# 例如：v0.2.0-rc.1 会创建预发布，v0.2.0 会创建正式发布。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10

jobs:
  build-macos:
    name: Build macOS universal
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust (Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Sync app version from tag
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: Run frontend tests
        run: pnpm test

      - name: Check frontend build
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build macOS bundles
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Collect macOS artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -exec cp {} release-artifacts/ \;
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz "release-artifacts/Luma-${VERSION}-macos-universal.app.tar.gz"
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "release-artifacts/Luma-${VERSION}-macos-universal.app.tar.gz.sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luma-macos
          path: release-artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required to publish signed updater artifacts"
          }

      - name: Sync app version from tag
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: Run frontend tests
        run: pnpm test

      - name: Check frontend build
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter *.msi | Select-Object -First 1
          $msiSig = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter *.msi.sig | Select-Object -First 1
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe.sig | Select-Object -First 1
          if ($null -eq $msi -or $null -eq $msiSig -or $null -eq $exe -or $null -eq $sig) { throw "Signed Windows installer artifacts were not produced" }
          Copy-Item $msi.FullName "release-artifacts/Luma-$version-windows-x64.msi"
          Copy-Item $msiSig.FullName "release-artifacts/Luma-$version-windows-x64.msi.sig"
          Copy-Item $exe.FullName "release-artifacts/Luma-$version-windows-x64-setup.exe"
          Copy-Item $sig.FullName "release-artifacts/Luma-$version-windows-x64-setup.exe.sig"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: luma-*
          path: release-artifacts
          merge-multiple: true

      - name: Create updater manifest
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.VERSION;
          const version = tag.replace(/^v/, '');
          const base = `https://github.com/${process.env.REPOSITORY}/releases/download/${tag}`;
          const files = {
            mac: `Luma-${version}-macos-universal.app.tar.gz`,
            macSig: `Luma-${version}-macos-universal.app.tar.gz.sig`,
            winMsi: `Luma-${version}-windows-x64.msi`,
            winMsiSig: `Luma-${version}-windows-x64.msi.sig`,
            win: `Luma-${version}-windows-x64-setup.exe`,
            winSig: `Luma-${version}-windows-x64-setup.exe.sig`,
          };

          for (const file of Object.values(files)) {
            if (!fs.existsSync(`release-artifacts/${file}`)) {
              throw new Error(`Missing updater artifact: ${file}`);
            }
          }

          const signature = (file) => fs.readFileSync(`release-artifacts/${file}`, 'utf8').trim();
          const platform = (urlFile, sigFile) => ({
            url: `${base}/${urlFile}`,
            signature: signature(sigFile),
          });

          const manifest = {
            version,
            notes: `Luma ${tag} 更新，包含搜索、批量选择、国际化和跨平台修复。`,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': platform(files.mac, files.macSig),
              'darwin-x86_64': platform(files.mac, files.macSig),
              'windows-x86_64': platform(files.win, files.winSig),
              'windows-x86_64-nsis': platform(files.win, files.winSig),
              'windows-x86_64-msi': platform(files.winMsi, files.winMsiSig),
            },
          };
          fs.writeFileSync('release-artifacts/latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Luma ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            Luma ${{ github.ref_name }}

            本版提供 macOS universal 与 Windows x64 构建：
            - macOS：`.dmg` 安装包与签名 updater `.app.tar.gz`
            - Windows：`.msi` 安装包、NSIS `.exe` 安装包与签名 updater 产物

            updater 使用签名清单和签名安装包；本构建尚未启用 Apple/Windows 代码签名或公证，首次安装时系统可能需要手动确认运行来源。
