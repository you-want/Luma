name: Release (build & publish)

# 触发条件：推送形如 v0.2.0 的 tag 就打包发版。
# 平台不上架 App Store，只产出可直接下载的 .dmg / .app，发布到 GitHub Releases。
on:
  push:
    tags:
      - 'v*'

# 需要写入权限才能创建 Release 并上传产物。
permissions:
  contents: write

# 同一个 tag 只跑一次，重复推送会取消进行中的旧任务。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # macOS 14 runner 是 Apple Silicon；配合 universal target 产出同时支持
    # Intel 和 Apple Silicon 的通用二进制。
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (含两种 macOS 架构)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 缓存 Cargo 依赖与编译产物，显著缩短后续构建时间。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 让打包出的应用版本与 tag 一致：v0.2.0 → 0.2.0，写回 tauri.conf.json。
      # 这样 .dmg 文件名、应用「关于」里的版本号都跟随 tag，无需手动改文件再提交。
      - name: Sync app version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting app version to $VERSION"
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n');" "$VERSION"

      # 发版前先跑测试，避免把坏的构建打包发出去。
      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # tauri-action 会执行 beforeBuildCommand（pnpm build）再打包，
      # 然后用当前 tag 创建 Release 并上传 .dmg / .app。
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 通用二进制：一份产物覆盖 Intel 与 Apple Silicon。
          args: --target universal-apple-darwin
          # Release 的 tag / 标题直接沿用推送的 git tag。
          tagName: ${{ github.ref_name }}
          releaseName: Luma ${{ github.ref_name }}
          # 直接发布（非草稿）。想先审阅再手动发布可改成 true。
          releaseDraft: false
          prerelease: false
          # 应用未签名/未公证，提示用户首次打开的绕过方式。
          releaseBody: |
            Luma ${{ github.ref_name }}

            下载 `.dmg`，拖入「应用程序」即可。

            > 该构建未经过 Apple 代码签名与公证。首次打开若提示“无法验证开发者”，
            > 请在「访达」中右键点击应用选择「打开」，或在「系统设置 › 隐私与安全性」中允许运行。
